<div class="search-panel">
  <label for="recipe-search" class="sr-only">Search recipes</label>
  <div class="search-row">
    <input
      id="recipe-search"
      type="text"
      name="recipeSearch"
      placeholder="Search recipes..."
      aria-label="Search recipes"
    />
    <button type="button">Search</button>
  </div>

  <div class="radio-group" role="radiogroup" aria-label="Search by">
    <label>
      <input type="radio" name="searchType" value="title" checked />
      <span>By title</span>
    </label>
    <label>
      <input type="radio" name="searchType" value="ingredient" />
      <span>By ingredient</span>
    </label>
  </div>
</div>
